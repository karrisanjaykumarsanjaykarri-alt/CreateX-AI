
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080817">

<title>CreateX AI - Video Generator</title>

<style>
:root {
  --bg: #080817;
  --panel: #12122b;
  --line: #302b69;
  --purple: #a52cff;
  --blue: #168cff;
  --text: #ffffff;
  --muted: #b7b5d8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(ellipse at top, #211044, var(--bg) 65%);
  color: var(--text);
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  padding: 22px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.logo span {
  color: var(--purple);
}

.tag {
  color: var(--muted);
  font-size: 12px;
}

main {
  width: 92%;
  max-width: 850px;
  margin: 45px auto;
}

h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

.subtitle {
  color: var(--muted);
  line-height: 1.6;
}

.panel {
  background: rgba(18,18,43,0.95);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 24px;
  margin-top: 28px;
}

label {
  display: block;
  margin: 18px 0 10px;
  font-weight: bold;
}

textarea, select {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #09091a;
  color: white;
  font-size: 15px;
}

textarea {
  min-height: 140px;
  resize: vertical;
}

textarea:focus, select:focus {
  outline: 2px solid var(--purple);
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 22px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, var(--purple), var(--blue));
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.status {
  margin-top: 18px;
  color: #c9b8ff;
  text-align: center;
  line-height: 1.5;
}

.result {
  display: none;
  margin-top: 25px;
}

video {
  width: 100%;
  border-radius: 12px;
  background: black;
  margin-top: 12px;
}

.download {
  display: block;
  text-align: center;
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
  background: #242044;
  color: white;
  text-decoration: none;
}

footer {
  text-align: center;
  padding: 30px;
  color: var(--muted);
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">CreateX <span>AI</span></div>
  <div class="tag">AI VIDEO STUDIO</div>
</header>

<main>

<h1>AI Video Generator</h1>

<p class="subtitle">
Turn your imagination into videos using artificial intelligence.
Describe your scene and let CreateX AI generate it.
</p>

<section class="panel">

<label for="prompt">Describe your video</label>

<textarea
  id="prompt"
  placeholder="Example: A cinematic scene of a futuristic city at sunset, flying cars and glowing buildings..."
></textarea>

<label for="duration">Video Duration</label>

<select id="duration">
  <option value="2">2 Seconds</option>
  <option value="3">3 Seconds</option>
  <option value="4">4 Seconds</option>
  <option value="5">5 Seconds</option>
</select>

<button id="generateBtn" onclick="generateVideo()">
  Generate Video
</button>

<div class="status" id="status">
  Enter your prompt to begin.
</div>

<div class="result" id="result">
  <h2>Your Generated Video</h2>

  <video id="videoPlayer" controls playsinline></video>

  <a
    id="downloadBtn"
    class="download"
    href="#"
    target="_blank"
    rel="noopener"
    download="createx-ai-video.mp4"
  >
    Download Video
  </a>
</div>

</section>

</main>

<footer>
  CreateX AI © 2026 | Powered by AI
</footer>

<script>

async function generateVideo() {

  const prompt = document.getElementById("prompt").value.trim();
  const duration = Number(document.getElementById("duration").value);

  const button = document.getElementById("generateBtn");
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const player = document.getElementById("videoPlayer");
  const download = document.getElementById("downloadBtn");

  if (!prompt) {
    status.textContent = "Please enter a video description.";
    return;
  }

  button.disabled = true;
  button.textContent = "Generating...";
  status.textContent = "Connecting to the AI model. Video generation may take several minutes.";
  result.style.display = "none";

  player.pause();
  player.removeAttribute("src");
  player.load();

  try {

    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt,
        duration: duration
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "Video generation failed.");
    }

    const video = data.video;

    const videoUrl =
      typeof video === "string"
        ? video
        : video?.url || video?.path;

    if (!videoUrl) {
      throw new Error("The AI returned no usable video URL.");
    }

    player.src = videoUrl;
    download.href = videoUrl;

    result.style.display = "block";
    status.textContent = "Your video has been generated!";

    player.load();

  } catch (error) {

    console.error(error);

    status.textContent = "Error: " + error.message;

  } finally {

    button.disabled = false;
    button.textContent = "Generate Video";

  }
}

</script>

</body>
</html>
